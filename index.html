<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <!-- Page title and basic metadata -->
    <title>Ryuukae's GitHub Pages</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A directory of active GitHub pages and projects by Adam Ross DeStafeno (Ryuukae), including modern designs, dynamic content, and responsive web applications."
    />
    <meta name="author" content="Adam Ross DeStafeno" />
    <meta
      name="keywords"
      content="GitHub, projects, portfolio, Adam Ross DeStafeno, Ryuukae, web development, multi-step form, FAQ, responsive design, UI/UX, APIs, full-stack"
    />
    <!-- openGraph metadata -->
    <meta property="og:title" content="Ryuukae's GitHub Pages" />
    <meta
      property="og:description"
      content="Explore active GitHub pages by Adam Ross DeStafeno (Ryuukae), featuring dynamic designs and innovative web applications."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pages.ryuukae.io" />
    <meta property="og:image" content="https://storage.googleapis.com/a1aa/image/default.jpg" />

    <!-- External stylesheets and fonts -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Local stylesheets -->
    <link rel="stylesheet" href="./src/styles/tailwind.css" type="text/css" />
    <link rel="stylesheet" href="./src/styles/base-styles.css" type="text/css" />
    <link rel="stylesheet" href="./src/styles/font-styles.css" type="text/css" />
    <link rel="stylesheet" href="./src/styles/debug-styles.css" type="text/css" />
    <link rel="stylesheet" href="./src/styles/modal.css" type="text/css" />

    <!--  Javascript imports -->
    <script src="./src/scripts/main.js" type="module"></script>
  </head>

  <body class="fade-in">
    <!-- Cyber-Glass Network Background -->
    <canvas id="network-canvas"></canvas>

    <!-- Header Section -->
    <div class="header-container relative">
      <!-- Lighthouse Starry Network -->
      <canvas id="header-canvas"></canvas>
      <h1
        class="header-title header-title-font text-cyan-400 font-extrabold tracking-wider drop-shadow-[0_0_25px_rgba(0,255,255,1)]"
      >
        Ryuukae's GitHub Pages
      </h1>
    </div>

    <!-- SubHeader Section (Contact Info) -->
    <div
      class="subheader-container mx-auto max-w-4xl mt-8 mb-12 p-6 bg-black/60 backdrop-blur-xl border border-cyan-500/30 shadow-[0_8px_32px_rgba(0,0,0,0.8)] rounded-3xl flex flex-col items-center animate-border-pulse"
    >
      <p class="subheader font-mono tracking-wide leading-relaxed text-center mb-8 text-gray-300">
        <i
          class="fas fa-book-open text-cyan-400 mr-2 drop-shadow-[0_0_8px_rgba(0,255,255,0.8)]"
        ></i>
        An active directory/listing of the GitHub pages written
        <br />
        <span class="mt-3 inline-block">
          by
          <a
            href="https://www.github.com/Ryuukae"
            class="name-pulse-gradient italic font-bold px-1 drop-shadow-[0_0_8px_rgba(0,255,255,0.2)]"
            >Adam Ross DeStafeno</a
          >
          (aka
          <span
            class="name-pulse-gradient italic font-bold px-1 drop-shadow-[0_0_8px_rgba(0,255,255,0.2)]"
            >Ryuukae</span
          >).
        </span>
      </p>

      <!-- Contact Pills -->
      <div class="flex flex-wrap justify-center items-center gap-4 w-full group mt-4">
        <a
          href="mailto:contact@adamrossdestafeno.dev"
          class="spark-btn flex items-center gap-2 px-5 py-2.5 rounded-full border border-cyan-900/30 text-cyan-400 group-hover:opacity-50 hover:!opacity-100 hover:text-white hover:bg-cyan-900/30 hover:border-cyan-400/60 hover:shadow-[0_0_15px_rgba(0,255,255,0.2)] transition-all duration-500 ease-in-out text-sm font-medium"
        >
          <i class="fas fa-envelope"></i> Email
        </a>
        <a
          href="https://www.linkedin.com/in/adam-ross-destafeno/"
          target="_blank"
          class="spark-btn flex items-center gap-2 px-5 py-2.5 rounded-full border border-cyan-900/30 text-cyan-400 group-hover:opacity-50 hover:!opacity-100 hover:text-white hover:bg-cyan-900/30 hover:border-cyan-400/60 hover:shadow-[0_0_15px_rgba(0,255,255,0.2)] transition-all duration-500 ease-in-out text-sm font-medium"
        >
          <i class="fab fa-linkedin"></i> LinkedIn
        </a>
        <a
          href="#"
          target="_blank"
          class="spark-btn flex items-center gap-2 px-5 py-2.5 rounded-full border border-cyan-900/30 text-cyan-400 group-hover:opacity-50 hover:!opacity-100 hover:text-white hover:bg-cyan-900/30 hover:border-cyan-400/60 hover:shadow-[0_0_15px_rgba(0,255,255,0.2)] transition-all duration-500 ease-in-out text-sm font-medium"
        >
          <i class="fas fa-briefcase"></i> Portfolio
        </a>
        <a
          href="https://www.github.com/Ryuukae"
          target="_blank"
          class="spark-btn flex items-center gap-2 px-5 py-2.5 rounded-full border border-cyan-900/30 text-cyan-400 group-hover:opacity-50 hover:!opacity-100 hover:text-white hover:bg-cyan-900/30 hover:border-cyan-400/60 hover:shadow-[0_0_15px_rgba(0,255,255,0.2)] transition-all duration-500 ease-in-out text-sm font-medium"
        >
          <i class="fab fa-github"></i> GitHub
        </a>
      </div>
    </div>

    <!-- Repositories Section (2-Column Masonry) -->
    <div class="flex flex-col mx-auto max-w-[1280px] py-[1%] px-[2%] w-full z-[11]">
      <ul id="repo-list-container" class="columns-1 md:columns-2 gap-6 list-none p-0"></ul>
    </div>
  </body>
</html>
