<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <!-- Page title and basic metadata -->
    <title>Ryuukae's GitHub Pages</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A directory of active GitHub pages and projects by Adam Ross DeStafeno (Ryuukae), including modern designs, dynamic content, and responsive web applications."
    />
    <meta name="author" content="Adam Ross DeStafeno" />
    <meta
      name="keywords"
      content="GitHub, projects, portfolio, Adam Ross DeStafeno, Ryuukae, web development, multi-step form, FAQ, responsive design, UI/UX, APIs, full-stack"
    />
    <!-- openGraph metadata -->
    <meta property="og:title" content="Ryuukae's GitHub Pages" />
    <meta
      property="og:description"
      content="Explore active GitHub pages by Adam Ross DeStafeno (Ryuukae), featuring dynamic designs and innovative web applications."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pages.ryuukae.io" />
    <meta property="og:image" content="https://storage.googleapis.com/a1aa/image/default.jpg" />

    <!-- External stylesheets and fonts -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Local stylesheets -->
    <link rel="stylesheet" href="./src/styles/tailwind.css" type="text/css" />
    <link rel="stylesheet" href="./src/styles/base-styles.css" type="text/css" />
    <link rel="stylesheet" href="./src/styles/font-styles.css" type="text/css" />
    <link rel="stylesheet" href="./src/styles/debug-styles.css" type="text/css" />

    <!--  Javascript imports -->
    <script src="./src/scripts/main.js" type="module"></script>
  </head>

  <!--IMPORTANT NOTE!! PLEASE READ!! -->
  <!-- add debug to classlist to enable debug view -->
  <body class="fade-in">
    <!-- Header Section -->
    <div class="header-container">
      <h1 class="header-title header-title-font">Ryuukae's GitHub Pages</h1>
    </div>

    <!-- SubHeader Section (Contact Info) -->
    <div
      class="subheader-container mx-auto max-w-4xl mt-8 mb-12 p-6 bg-[var(--repo-background)]/80 backdrop-blur-md border border-[var(--blue-5)]/30 shadow-[0_4px_24px_rgba(0,0,0,0.5)] rounded-2xl flex flex-col items-center"
    >
      <p class="subheader subheader-title-font text-center mb-6">
        <i class="fas fa-book-open text-[var(--blue-1)] mr-2"></i> An active directory/listing of
        the GitHub pages written
        <br />
        <span class="mt-2 inline-block">
          by
          <a
            href="https://www.github.com/Ryuukae"
            class="text-[var(--blue-1)] font-bold hover:text-[var(--blue-5)] transition-colors"
            >Adam Ross DeStafeno</a
          >
          (aka Ryuukae).
        </span>
      </p>

      <!-- Contact Pills -->
      <div class="flex flex-wrap justify-center items-center gap-4 w-full">
        <a
          href="mailto:contact@adamrossdestafeno.dev"
          class="flex items-center gap-2 px-4 py-2 rounded-full bg-[var(--blue-900)]/20 border border-[var(--blue-5)]/30 text-[var(--blue-1)] hover:bg-[var(--blue-5)] hover:text-white hover:-translate-y-1 hover:shadow-[0_4px_12px_rgba(82,139,141,0.4)] transition-all duration-300 text-sm font-medium"
        >
          <i class="fas fa-envelope"></i> Email
        </a>
        <a
          href="https://www.linkedin.com/in/adam-ross-destafeno/"
          target="_blank"
          class="flex items-center gap-2 px-4 py-2 rounded-full bg-[var(--blue-900)]/20 border border-[var(--blue-5)]/30 text-[var(--blue-1)] hover:bg-[var(--blue-5)] hover:text-white hover:-translate-y-1 hover:shadow-[0_4px_12px_rgba(82,139,141,0.4)] transition-all duration-300 text-sm font-medium"
        >
          <i class="fab fa-linkedin"></i> LinkedIn
        </a>
        <a
          href="#"
          target="_blank"
          class="flex items-center gap-2 px-4 py-2 rounded-full bg-[var(--blue-900)]/20 border border-[var(--blue-5)]/30 text-[var(--blue-1)] hover:bg-[var(--blue-5)] hover:text-white hover:-translate-y-1 hover:shadow-[0_4px_12px_rgba(82,139,141,0.4)] transition-all duration-300 text-sm font-medium"
        >
          <i class="fas fa-briefcase"></i> Developer Portfolio
        </a>
        <a
          href="https://www.github.com/Ryuukae"
          target="_blank"
          class="flex items-center gap-2 px-4 py-2 rounded-full bg-[var(--blue-900)]/20 border border-[var(--blue-5)]/30 text-[var(--blue-1)] hover:bg-[var(--blue-5)] hover:text-white hover:-translate-y-1 hover:shadow-[0_4px_12px_rgba(82,139,141,0.4)] transition-all duration-300 text-sm font-medium"
        >
          <i class="fab fa-github"></i> @ryuukae
        </a>
      </div>
    </div>

    <!-- Repositories Section (2-Column Grid) -->
    <div class="flex flex-col mx-auto max-w-[1280px] py-[1%] px-[2%] w-full z-[11]">
      <ul id="repo-list-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 list-none p-0"></ul>
    </div>
  </body>
</html>
