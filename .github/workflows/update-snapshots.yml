name: Update Visual Snapshots

on:
  workflow_dispatch:

jobs:
  update-snapshots:
    name: Generate Linux E2E Snapshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Add the secret to the job's environment to bypass local linter errors
    env:
      GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build Production Bundle
        run: npm run build

      - name: Update Snapshots
        run: npm run snapshots:renew

      - name: Import GPG Key for Verified Signatures
        uses: crazy-max/ghaction-import-gpg@v6
        if: env.GPG_KEY != ''
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: false

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'test(e2e): update linux visual regression snapshots'
          file_pattern: 'tests/e2e/**/*-snapshots/*.png'
          commit_user_name: 'Ryuukae'
          commit_user_email: 'ryuukae.dev@gmail.com'
          commit_author: 'Ryuukae <ryuukae.dev@gmail.com>'
          commit_options: '--no-verify'
